<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="55%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#7ee787"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#30363d" stop-opacity="0"/>
      <stop offset="20%" stop-color="#30363d"/>
      <stop offset="80%" stop-color="#30363d"/>
      <stop offset="100%" stop-color="#30363d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ee787" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7ee787" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7ee787" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="portrait-clip">
      <rect x="70" y="90" width="280" height="290" rx="6"/>
    </clipPath>
    <filter id="crt" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- Window -->
  <rect width="1200" height="400" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="1"/>

  <!-- Title bar -->
  <path d="M0 14 Q0 0 14 0 L1186 0 Q1200 0 1200 14 L1200 40 L0 40 Z" fill="#161b22"/>
  <line x1="0" y1="40" x2="1200" y2="40" stroke="#30363d" stroke-width="1"/>

  <!-- Traffic lights -->
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="20" r="6" fill="#febc2e"/>
  <circle cx="68" cy="20" r="6" fill="#28c840"/>

  <!-- Title -->
  <text x="600" y="25" font-size="12" fill="#7d8590" text-anchor="middle">hrishi@github — zsh — 120x28</text>

  <!-- Portrait frame -->
  <rect x="65" y="85" width="290" height="300" rx="8" fill="#0a0d12" stroke="#30363d" stroke-width="1"/>

  <!-- Portrait area with clip -->
  <g clip-path="url(#portrait-clip)">
    <!-- Pixelated portrait with idle bob -->
    <g filter="url(#crt)">
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="0 0; 0 -3; 0 0; 0 2; 0 0" dur="3.2s" repeatCount="indefinite"/>
        <image
          href="data:image/png;base64,"
          x="80" y="95" width="260" height="285"
          image-rendering="pixelated"
          preserveAspectRatio="xMidYMid meet"/>
      </g>
    </g>

    <!-- Scanline sweep -->
    <rect x="70" y="90" width="280" height="60" fill="url(#scan)" opacity="0.6">
      <animate attributeName="y" values="90;380;90" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- Horizontal CRT scanlines (static) -->
    <g opacity="0.08" fill="#000">
      <rect x="70" y="92" width="280" height="1"/>
      <rect x="70" y="96" width="280" height="1"/>
      <rect x="70" y="100" width="280" height="1"/>
      <rect x="70" y="104" width="280" height="1"/>
      <rect x="70" y="108" width="280" height="1"/>
      <rect x="70" y="112" width="280" height="1"/>
      <rect x="70" y="116" width="280" height="1"/>
      <rect x="70" y="120" width="280" height="1"/>
      <rect x="70" y="124" width="280" height="1"/>
      <rect x="70" y="128" width="280" height="1"/>
      <rect x="70" y="132" width="280" height="1"/>
      <rect x="70" y="136" width="280" height="1"/>
      <rect x="70" y="140" width="280" height="1"/>
      <rect x="70" y="144" width="280" height="1"/>
      <rect x="70" y="148" width="280" height="1"/>
      <rect x="70" y="152" width="280" height="1"/>
      <rect x="70" y="156" width="280" height="1"/>
      <rect x="70" y="160" width="280" height="1"/>
      <rect x="70" y="164" width="280" height="1"/>
      <rect x="70" y="168" width="280" height="1"/>
      <rect x="70" y="172" width="280" height="1"/>
      <rect x="70" y="176" width="280" height="1"/>
      <rect x="70" y="180" width="280" height="1"/>
      <rect x="70" y="184" width="280" height="1"/>
      <rect x="70" y="188" width="280" height="1"/>
      <rect x="70" y="192" width="280" height="1"/>
      <rect x="70" y="196" width="280" height="1"/>
      <rect x="70" y="200" width="280" height="1"/>
      <rect x="70" y="204" width="280" height="1"/>
      <rect x="70" y="208" width="280" height="1"/>
      <rect x="70" y="212" width="280" height="1"/>
      <rect x="70" y="216" width="280" height="1"/>
      <rect x="70" y="220" width="280" height="1"/>
      <rect x="70" y="224" width="280" height="1"/>
      <rect x="70" y="228" width="280" height="1"/>
      <rect x="70" y="232" width="280" height="1"/>
      <rect x="70" y="236" width="280" height="1"/>
      <rect x="70" y="240" width="280" height="1"/>
      <rect x="70" y="244" width="280" height="1"/>
      <rect x="70" y="248" width="280" height="1"/>
      <rect x="70" y="252" width="280" height="1"/>
      <rect x="70" y="256" width="280" height="1"/>
      <rect x="70" y="260" width="280" height="1"/>
      <rect x="70" y="264" width="280" height="1"/>
      <rect x="70" y="268" width="280" height="1"/>
      <rect x="70" y="272" width="280" height="1"/>
      <rect x="70" y="276" width="280" height="1"/>
      <rect x="70" y="280" width="280" height="1"/>
      <rect x="70" y="284" width="280" height="1"/>
      <rect x="70" y="288" width="280" height="1"/>
      <rect x="70" y="292" width="280" height="1"/>
      <rect x="70" y="296" width="280" height="1"/>
      <rect x="70" y="300" width="280" height="1"/>
      <rect x="70" y="304" width="280" height="1"/>
      <rect x="70" y="308" width="280" height="1"/>
      <rect x="70" y="312" width="280" height="1"/>
      <rect x="70" y="316" width="280" height="1"/>
      <rect x="70" y="320" width="280" height="1"/>
      <rect x="70" y="324" width="280" height="1"/>
      <rect x="70" y="328" width="280" height="1"/>
      <rect x="70" y="332" width="280" height="1"/>
      <rect x="70" y="336" width="280" height="1"/>
      <rect x="70" y="340" width="280" height="1"/>
      <rect x="70" y="344" width="280" height="1"/>
      <rect x="70" y="348" width="280" height="1"/>
      <rect x="70" y="352" width="280" height="1"/>
      <rect x="70" y="356" width="280" height="1"/>
      <rect x="70" y="360" width="280" height="1"/>
      <rect x="70" y="364" width="280" height="1"/>
      <rect x="70" y="368" width="280" height="1"/>
      <rect x="70" y="372" width="280" height="1"/>
      <rect x="70" y="376" width="280" height="1"/>
    </g>
  </g>

  <!-- Live indicator dot -->
  <g transform="translate(340, 105)">
    <circle r="4" fill="#7ee787">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="12" y="4" font-size="10" fill="#7d8590" font-weight="600">LIVE</text>
  </g>

  <!-- Right side: neofetch content -->
  <g transform="translate(420, 110)">
    <!-- Name header -->
    <text y="0" font-size="34" font-weight="800" fill="url(#accent)" letter-spacing="-0.5">Hrishiraj Sarmah</text>
    <text y="26" font-size="13" fill="#7d8590" font-weight="500">Software Engineer · Machine Learning · Backend Systems</text>
    <line x1="0" y1="46" x2="700" y2="46" stroke="url(#rule)" stroke-width="1"/>

    <!-- Neofetch key-value rows -->
    <g font-size="14">
      <text y="78" fill="#a371f7" font-weight="600">Building</text>
      <text y="78" x="130" fill="#c9d1d9">proximity-broadcast social apps · mesh-networked Android tools</text>

      <text y="106" fill="#a371f7" font-weight="600">Exploring</text>
      <text y="106" x="130" fill="#c9d1d9">transformers · VLMs · agent orchestration · distributed systems</text>

      <text y="134" fill="#a371f7" font-weight="600">Stack</text>
      <text y="134" x="130" fill="#c9d1d9">Python · FastAPI · PyTorch · Next.js · Postgres · Docker</text>

      <text y="162" fill="#a371f7" font-weight="600">Location</text>
      <text y="162" x="130" fill="#c9d1d9">Jaipur, India</text>

      <text y="190" fill="#a371f7" font-weight="600">Portfolio</text>
      <text y="190" x="130" fill="#58a6ff">itshrs.dev</text>
    </g>

    <!-- Palette dots -->
    <g transform="translate(0, 218)">
      <circle cx="6" cy="6" r="6" fill="#ff7b72"/>
      <circle cx="26" cy="6" r="6" fill="#f2cc60"/>
      <circle cx="46" cy="6" r="6" fill="#7ee787"/>
      <circle cx="66" cy="6" r="6" fill="#58a6ff"/>
      <circle cx="86" cy="6" r="6" fill="#a371f7"/>
      <circle cx="106" cy="6" r="6" fill="#d2a8ff"/>
    </g>

    <!-- Prompt -->
    <g transform="translate(0, 258)">
      <text font-size="14" fill="#7ee787" font-weight="700">➜</text>
      <text x="20" font-size="14" fill="#58a6ff" font-weight="700">~</text>
      <text x="36" font-size="14" fill="#c9d1d9">git commit -m "shipping"</text>
      <rect x="260" y="-13" width="9" height="17" fill="#c9d1d9">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
