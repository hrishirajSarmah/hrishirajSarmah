<svg width="400" height="460" viewBox="0 0 400 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="soft-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
  </defs>

  <!-- Primary ambient glow — slow palette cycle -->
  <g opacity="0.55" filter="url(#soft-blur)">
    <circle cx="200" cy="210" r="135" fill="#58a6ff">
      <animate attributeName="fill"
        values="#58a6ff;#a371f7;#7ee787;#d2a8ff;#58a6ff"
        dur="14s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Secondary accent glow — offset phase, gentle pulse -->
  <g opacity="0.4" filter="url(#soft-blur)">
    <circle cx="200" cy="250" r="90" fill="#a371f7">
      <animate attributeName="fill"
        values="#a371f7;#7ee787;#58a6ff;#f2cc60;#a371f7"
        dur="14s" repeatCount="indefinite" begin="-3.5s"/>
      <animate attributeName="r"
        values="90;110;90"
        dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Pixelated portrait sprite with idle bob -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 -5; 0 0; 0 4; 0 0" dur="3.6s" repeatCount="indefinite"/>
    <image
      href="data:image/png;base64,"
      x="80" y="40" width="240" height="340"
      image-rendering="pixelated"
      preserveAspectRatio="xMidYMid meet"/>
  </g>
</svg>
